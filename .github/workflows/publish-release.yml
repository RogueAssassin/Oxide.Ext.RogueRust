name: Legacy Public Publisher (Disabled)

# Public releases are now built and published exclusively by
# RogueAssassin/Oxide.Ext.RogueRust-Source after its protected build succeeds.
# This workflow remains manual-only as a visible compatibility marker and must
# not react to release tags or rebuild assets from the public repository root.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release ownership
        run: |
          echo "Public release publishing is owned by RogueAssassin/Oxide.Ext.RogueRust-Source."
          echo "No build or publish action is performed from the public repository."
